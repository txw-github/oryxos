<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">OryxOS 系统架构</title>
  <desc id="desc">OryxOS 单体应用架构：CLI 和 REST API 汇入 ReAct 引擎；引擎调用 Provider、Memory、Tool 能力，并使用 SQLite 与工作区文件。LLM 服务和 MCP Server 位于应用外部。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fc"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16243b"/><stop offset="1" stop-color="#253d5e"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1c3555" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#74849b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3976c5"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1b2b42}
      .title{font-size:34px;font-weight:700;letter-spacing:.2px}.subtitle{font-size:15px;fill:#607087}
      .section{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#71819a}
      .h{font-size:20px;font-weight:700}.body{font-size:14px;fill:#53647b}.small{font-size:12px;fill:#738198}.mod{font-size:11px;font-family:Consolas,monospace;fill:#6c7d93}
      .white{fill:#fff}.line{stroke:#93a1b4;stroke-width:2;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#3976c5;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue)}
      .card{fill:#fff;stroke:#dce4ef;stroke-width:1.2;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <text x="72" y="68" class="title">OryxOS 系统架构</text>
  <text x="72" y="98" class="subtitle">企业自托管的 Agent OS · 统一运行时内核 · 模块化单体，单二进制交付</text>
  <rect x="1184" y="48" width="184" height="34" rx="17" fill="#e4edf9"/>
  <text x="1276" y="70" text-anchor="middle" class="small" style="font-weight:700;fill:#3869a5">JDK 21 · Spring Boot 3.x</text>

  <!-- Application boundary -->
  <rect x="56" y="138" width="1058" height="780" rx="24" fill="#f9fbfe" stroke="#c8d5e5" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="82" y="122" width="282" height="32" rx="16" fill="#e8eef7"/>
  <text x="223" y="143" class="small" text-anchor="middle" style="font-weight:700;fill:#50627c">ORYXOS 进程边界 · 私有部署</text>

  <text x="88" y="188" class="section">接入层 · CHANNELS</text>
  <rect x="88" y="207" width="240" height="76" rx="14" class="card"/>
  <circle cx="119" cy="245" r="17" fill="#e9f2ff"/><text x="119" y="250" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#3976c5">CLI</text>
  <text x="148" y="238" class="h" style="font-size:17px">CLI Channel</text><text x="148" y="260" class="body">本地交互与调试</text>
  <text x="101" y="302" class="mod">oryxos-channel-cli · oryxos-cli</text>
  <rect x="365" y="207" width="330" height="76" rx="14" class="card"/>
  <circle cx="397" cy="245" r="17" fill="#e9f2ff"/><text x="397" y="250" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#3976c5">API</text>
  <text x="426" y="238" class="h" style="font-size:17px">Web Service · REST API</text><text x="426" y="260" class="body">业务系统集成 · Spring MVC</text>
  <text x="378" y="302" class="mod">oryxos-web</text>
  <path d="M208 315v36h254v18" class="line"/><path d="M530 315v54" class="line"/>

  <!-- Engine -->
  <rect x="250" y="368" width="500" height="166" rx="20" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="500" y="401" text-anchor="middle" class="section" style="fill:#a9c2e2">AGENT ENGINE · 核心引擎</text>
  <text x="500" y="439" text-anchor="middle" class="white" style="font-size:28px;font-weight:700">ReActLoop</text>
  <text x="500" y="467" text-anchor="middle" class="white" style="font-size:14px;opacity:.86">接收消息 → 组装 Prompt → 调用 LLM → 执行 Tool → 回填结果</text>
  <rect x="320" y="486" width="148" height="27" rx="13" fill="#314a69"/><text x="394" y="504" text-anchor="middle" class="white" style="font-size:12px">PromptBuilder</text>
  <rect x="480" y="486" width="148" height="27" rx="13" fill="#314a69"/><text x="554" y="504" text-anchor="middle" class="white" style="font-size:12px">ToolExecutor</text>
  <text x="270" y="552" class="mod">oryxos-core · 接口解耦；工具调度由 OryxOS 自己控制</text>

  <!-- Capabilities -->
  <text x="88" y="596" class="section">运行时能力 · CAPABILITIES</text>
  <path d="M365 534v42H249v24M500 534v66M635 534v42h116v24" class="line"/>
  <rect x="88" y="618" width="320" height="136" rx="16" class="card"/>
  <rect x="88" y="618" width="6" height="136" rx="3" fill="#4a83c8"/>
  <text x="112" y="653" class="h">Provider · LLM 接入</text>
  <text x="112" y="680" class="body">ProviderService · 显式模型映射</text><text x="112" y="703" class="body">Spring AI Alibaba 协议适配</text>
  <text x="112" y="733" class="mod">oryxos-provider</text>
  <rect x="428" y="618" width="320" height="136" rx="16" class="card"/>
  <rect x="428" y="618" width="6" height="136" rx="3" fill="#7b68c5"/>
  <text x="452" y="653" class="h">Memory · 统一记忆门面</text>
  <text x="452" y="680" class="body">会话历史 · 长期记忆 · prompt 上下文</text><text x="452" y="703" class="body">MemoryService 屏蔽底层存储差异</text>
  <text x="452" y="733" class="mod">oryxos-memory</text>
  <rect x="768" y="618" width="320" height="136" rx="16" class="card"/>
  <rect x="768" y="618" width="6" height="136" rx="3" fill="#d1883e"/>
  <text x="792" y="653" class="h">Tool · 工具执行体系</text>
  <text x="792" y="680" class="body">内置 Tool · MCP · ToolRegistry</text><text x="792" y="703" class="body">SandboxChecker · 白名单校验</text>
  <text x="792" y="733" class="mod">oryxos-tool</text>

  <!-- persistence -->
  <text x="88" y="795" class="section">基础设施与持久化 · FOUNDATION</text>
  <path d="M248 754v28M588 754v28M928 754v28" class="line"/>
  <rect x="88" y="814" width="320" height="78" rx="14" fill="#eef4fc" stroke="#d5e1f0"/>
  <text x="110" y="844" class="h" style="font-size:16px">SQLite · 结构化数据</text><text x="110" y="868" class="body">sessions · llm_calls · tool_invocations</text>
  <rect x="428" y="814" width="320" height="78" rx="14" fill="#eef4fc" stroke="#d5e1f0"/>
  <text x="450" y="844" class="h" style="font-size:16px">.oryxos/ · 工作区文件</text><text x="450" y="868" class="body">Profile YAML · Bootstrap · Skills · MEMORY.md</text>
  <rect x="768" y="814" width="320" height="78" rx="14" fill="#eef4fc" stroke="#d5e1f0"/>
  <text x="790" y="844" class="h" style="font-size:16px">运行支撑</text><text x="790" y="868" class="body">配置与密钥 · 结构化日志 · CLI 启动</text>
  <text x="88" y="910" class="mod">oryxos-storage · oryxos-cli · oryxos-boot（依赖组装并打包为 fat JAR）</text>

  <!-- External systems -->
  <text x="1150" y="188" class="section">外部系统</text>
  <rect x="1150" y="228" width="238" height="136" rx="16" class="card"/>
  <circle cx="1182" cy="264" r="17" fill="#e8f5ef"/><path d="M1174 264h16m-8-8v16" stroke="#32815d" stroke-width="2"/>
  <text x="1210" y="261" class="h" style="font-size:17px">LLM Providers</text>
  <text x="1174" y="296" class="body">DeepSeek · Qwen · Kimi</text><text x="1174" y="319" class="body">Ollama · vLLM · 其他 API</text><text x="1174" y="346" class="small">可连接云端或企业本地模型</text>
  <path d="M248 618v-40h817v-282h85" class="blueLine"/><text x="868" y="282" class="small">Provider 模型请求 / 响应</text>

  <rect x="1150" y="430" width="238" height="136" rx="16" class="card"/>
  <circle cx="1182" cy="466" r="17" fill="#fff1df"/><text x="1182" y="471" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#b67631">MCP</text>
  <text x="1210" y="463" class="h" style="font-size:17px">MCP Servers</text>
  <text x="1174" y="498" class="body">外部工具服务</text><text x="1174" y="521" class="body">stdio / SSE · JSON-RPC</text><text x="1174" y="548" class="small">工具执行委托给外部服务</text>
  <path d="M1088 685h32v-187h30" class="blueLine"/><text x="1095" y="480" class="small" transform="rotate(-90 1095 480)">工具调用 / 结果</text>

  <rect x="1150" y="636" width="238" height="176" rx="16" fill="#e9eff7" stroke="#d4deeb"/>
  <text x="1174" y="672" class="h" style="font-size:17px">部署与扩展</text>
  <text x="1174" y="704" class="body">当前：单体应用 · fat JAR</text>
  <text x="1174" y="730" class="body">企业自有 K8s / 服务器</text>
  <path d="M1174 752h188" stroke="#cbd7e6"/>
  <text x="1174" y="777" class="small">扩展：新增 Channel / Provider / Tool</text><text x="1174" y="797" class="small">沿接口扩展，不改 ReAct 核心</text>

  <text x="1150" y="888" class="small">数据保留在企业自有基础设施内</text>
</svg>
